services:
  backend:
    build:
      context: ./backend
    image: foodoverfussreg.azurecr.io/backend:latest
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build:
      context: ./frontend
    image: foodoverfussreg.azurecr.io/frontend:latest
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: always
