name: Build, Push & Deploy

on:
  push:
    branches:
      - main

env:
  BACKEND_IMAGE: backend
  FRONTEND_IMAGE: frontend
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Job 1: Build & Push to ACR ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push to ACR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_ACR_SERVER }}
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.AZURE_ACR_SERVER }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.AZURE_ACR_SERVER }}/${{ env.FRONTEND_IMAGE }}:latest
          build-args: NEXT_PUBLIC_API_BASE_URL=http://${{ secrets.VM_HOST }}:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2: Deploy to Azure VM ──────────────────────────────────────────────
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # 1. Login ke ACR di dalam VM agar izin akses 'pull' diberikan
            docker login ${{ secrets.AZURE_ACR_SERVER }} \
              -u ${{ secrets.AZURE_ACR_USERNAME }} \
              -p ${{ secrets.AZURE_ACR_PASSWORD }}

            # 2. Masuk ke folder proyek dengan huruf kapital yang benar
            cd ~/Food-Over-Fuss

            # 3. Ambil perubahan file docker-compose.yml terbaru dari GitHub
            git pull origin main

            # 4. Tarik image matang dari ACR (Sangat ringan, tidak membebani RAM)
            docker compose pull

            # 5. Jalankan kontainer dalam mode background
            docker compose up -d

            # 6. Bersihkan sisa sisa image lama agar penyimpanan VM tidak penuh
            docker image prune -f